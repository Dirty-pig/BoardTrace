<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初始化系统</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='backend.css') }}"></head>
<body class="auth-body"><main class="auth-card wide"><div class="auth-brand"><div class="brand-mark">板</div><div><strong>首次启动</strong><span>创建唯一ROOT账户</span></div></div><h1>初始化问题系统</h1><p>初始化完成后，此入口自动关闭。密码仅保存Argon2哈希。</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field"><span>系统名称</span><input name="system_name" value="板迹"></label><label class="field"><span>ROOT用户名</span><input name="username" required minlength="3" autocomplete="username"></label><label class="field"><span>密码</span><input type="password" name="password" required minlength="10" autocomplete="new-password"></label><label class="field"><span>确认密码</span><input type="password" name="confirm_password" required minlength="10" autocomplete="new-password"></label><button class="primary-button auth-submit">完成初始化</button></form></main></body></html>
