<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · {{ system_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='backend.css') }}"></head>
<body class="auth-body"><main class="auth-card"><div class="auth-brand"><div class="brand-mark">板</div><div><strong>{{ system_name }}</strong><span>轻量问题系统</span></div></div><h1>欢迎回来</h1><p>登录后继续记录板卡、问题和工作过程。</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field"><span>用户名</span><input name="username" autofocus required autocomplete="username"></label><label class="field"><span>密码</span><input type="password" name="password" required autocomplete="current-password"></label><button class="primary-button auth-submit">登录</button></form><small>本机服务 · 未登录无法访问工作数据</small></main></body></html>
