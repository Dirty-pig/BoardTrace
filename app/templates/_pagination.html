{% if pagination.pages > 1 %}<nav class="pagination"><span>第 {{ pagination.page }} / {{ pagination.pages }} 页</span><div>{% if pagination.has_prev %}<a class="secondary-button" href="{{ url_for(request.endpoint,page=pagination.prev_num,q=request.args.get('q',''),status=request.args.get('status',''),priority=request.args.get('priority','')) }}">上一页</a>{% endif %}{% if pagination.has_next %}<a class="secondary-button" href="{{ url_for(request.endpoint,page=pagination.next_num,q=request.args.get('q',''),status=request.args.get('status',''),priority=request.args.get('priority','')) }}">下一页</a>{% endif %}</div></nav>{% endif %}
