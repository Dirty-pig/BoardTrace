name: boardtrace

services:
  boardtrace:
    build: .
    image: boardtrace:local
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - boardtrace_data:/app/data
      - boardtrace_backups:/app/data/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  boardtrace_data:
  boardtrace_backups:
